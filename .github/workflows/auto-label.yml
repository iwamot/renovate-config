name: 'Auto label by title'
on:
  pull_request:
    types: [opened, edited]
    branches: [ "main" ]

permissions: {}

jobs:
  label:
    permissions:
      pull-requests: write  # to add a label to the PR
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/auto-label.yml@47e6133c3b26cc371e5330eaf310a4c6b5470211 # v8.15.0

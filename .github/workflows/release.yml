name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.22.0)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@47e6133c3b26cc371e5330eaf310a4c6b5470211 # v8.15.0
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      contents: write  # to create the GitHub Release

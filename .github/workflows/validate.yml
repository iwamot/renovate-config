name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [ "main" ]
  # Daily, so a new advisory against the locked dependencies fails the audit
  # even when nothing else changes.
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/validate.yml@47e6133c3b26cc371e5330eaf310a4c6b5470211 # v8.15.0

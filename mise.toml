min_version = "2026.10.25"

[settings]
experimental = true
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "aube"

[tool_config]
locked = true

[tools]
node = "26.13.0"
"aqua:aubepkg/aube" = "2.9.0"

# Manually published releases that carry no provenance. mise drives aube
# through its embedder API, so an AUBE_* environment variable does not reach
# this install; the exclusions belong to the tool that pulls them in.
[tools."npm:renovate"]
version = "44.210.0"
# RE2 needs its install script to provide the native regex engine.
allow_builds = ["re2"]
trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]

[task_config]
includes = [
  "git::https://github.com/iwamot/mise-tasks.git//.mise/tasks?ref=v3.5.0",
]

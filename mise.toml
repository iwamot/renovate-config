min_version = "2026.10.19"

[settings]
experimental = true
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "aube"

[tools]
node = "26.13.0"
"aqua:aubepkg/aube" = "2.8.4"

# Manually published releases that carry no provenance. mise drives aube
# through its embedder API, so an AUBE_* environment variable does not reach
# this install; the exclusions belong to the tool that pulls them in.
[tools."npm:renovate"]
version = "44.192.2"
# RE2 needs its install script to provide the native regex engine.
allow_builds = ["re2"]
trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
  "@smithy/core@3.33.0",
  "@smithy/node-http-handler@4.11.0",
]

[task_config]
includes = [
  "git::https://github.com/iwamot/mise-tasks.git//.mise/tasks?ref=v3.3.0",
]

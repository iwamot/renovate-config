min_version = "2026.8.6"

[settings]
lockfile = true
npm.package_manager = "aube"

[tool_config]
locked = true

[env]
AUBE_TRUST_POLICY_EXCLUDE = "@yarnpkg/libzip@3.2.2,@smithy/core@3.33.0,@smithy/node-http-handler@4.11.0"

[tools]
node = "24.19.0"
"aqua:jdx/aube" = "1.40.0"
"npm:renovate" = "44.30.3"

[task_config]
includes = [
  "git::https://github.com/iwamot/mise-tasks.git//.mise/tasks?ref=v2.5.1",
]
